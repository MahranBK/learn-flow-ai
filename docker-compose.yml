services:
  db:
    image: postgres:15-alpine
    container_name: learnflow_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: learnflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d learnflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    container_name: learnflow_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/learnflow_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-me}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.8-flash}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT-low}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-45}
  
    
    depends_on:
       db:
          condition: service_healthy

  frontend:
    build: ./frontend
    container_name: learnflow_web
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
